name: hermes-hybrid-agent-router
title: Hermes Hybrid Agent Router
description: >-
  Hermes Agent setup that routes tasks between local Ollama/llama.cpp models and
  OpenAI Codex authority models to reduce cost, preserve privacy, and keep
  high-risk work verified.
